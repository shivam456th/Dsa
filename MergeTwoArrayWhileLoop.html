<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merge Two array with while Loop</title>
</head>
<body>
<script>
    let data = [3, 7, 12, 34, 56, 90];
    let data2 = [4, 9, 25, 45];
    let data3 = [];

    let d1 = 0;
    let d2 = 0;
    let d3 = 0;

    // dono arrays ko compare karke merge
    while (d1 < data.length && d2 < data2.length) {
        if (data[d1] < data2[d2]) {
            data3[d3] = data[d1];
            d1++;
        } else {
            data3[d3] = data2[d2];
            d2++;
        }
        d3++;
    }

    // agar data array ke elements bache ho
    while (d1 < data.length) {
        data3[d3] = data[d1];
        d1++;
        d3++;
    }

    // agar data2 array ke elements bache ho
    while (d2 < data2.length) {
        data3[d3] = data2[d2];
        d2++;
        d3++;
    }

    console.warn(data3);
</script>
</body>
</html>
